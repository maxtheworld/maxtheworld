<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业车辆管理系统</title>
    <style>
        :root {
            --primary-color: #e8a2c2;
            --secondary-color: #e47daa;
            --light-color: #ecf0f1;
            --dark-color: #efaeca;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            color: #333;
        }
        .header {
            background-color: var(--primary-color);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
        }
        .user-info {
            display: flex;
            align-items: center;
        }
        .container {
            display: flex;
            min-height: calc(100vh - 60px);
        }
        .sidebar {
            width: 220px;
            background-color: var(--dark-color);
            color: white;
            padding: 20px 0;
        }
        .menu-item {
            padding: 12px 20px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .menu-item:hover, .menu-item.active {
            background-color: var(--secondary-color);
        }
        .main-content {
            flex: 1;
            padding: 20px;
        }
        .dashboard-cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background-color: white;
            border-radius: 5px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }
        .card h3 {
            margin-top: 0;
            color: var(--primary-color);
        }
        .card .value {
            font-size: 28px;
            font-weight: bold;
            margin: 10px 0;
            color: var(--secondary-color);
        }
        .table-container {
            background-color: white;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 20px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: var(--light-color);
            font-weight: bold;
        }
        tr:hover {
            background-color: #f9f9f9;
        }
        .action-btn {
            padding: 5px 10px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            margin-right: 5px;
        }
        .edit-btn {
            background-color: #e47daa;
            color: white;
        }
        .delete-btn {
            background-color: #e8b9d0;
            color: white;
        }
        .add-btn {
            background-color: var(--secondary-color);
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            margin-bottom: 20px;
            display: inline-block;
        }
    </style>
</head>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    $(document).ready(function() {
        $('.menu-item').click(function() {
            // 移除所有active类
            $('.menu-item').removeClass('active');
            // 给当前点击项添加active类
            $(this).addClass('active');

            // 根据点击的菜单项加载对应页面
            const menuText = $(this).text().trim();
            let pageName = '';
            switch(menuText) {
                case '首页': pageName = 'qw.html'; break;
                case '用车申请': pageName = 'application.html'; break;
                case '维修保养': pageName = 'maintenance.html'; break;
                case '加油记录': pageName = 'refueling.html'; break;
                case '违章记录': pageName = 'violation.html'; break;
                case '年检管理': pageName = 'inspection.html'; break;
            }
            window.location.href = pageName;
        });
    });
</script>
<body>
<div class="header">
    <div class="logo">企业车辆管理系统</div>
    <div class="user-info">
        欢迎，edawrd
    </div>
</div>

<div class="container">
    <div class="sidebar">
        <div class="menu-item active">首页</div>
        <div class="menu-item">用车申请</div>
        <div class="menu-item">维修保养</div>
        <div class="menu-item">加油记录</div>
        <div class="menu-item">违章记录</div>
        <div class="menu-item">年检管理</div>
    </div>

    <div class="main-content">
        <h2>车辆总览</h2>

        <div class="dashboard-cards">
            <div class="card">
                <h3>车辆总数</h3>
                <div class="value">4</div>
            </div>
            <div class="card">
                <h3>可用车辆</h3>
                <div class="value">2</div>
            </div>
            <div class="card">
                <h3>使用中</h3>

            </div>
            <div class="card">

                <div class="value">1</div>
            </div>
        </div>

        <button class="add-btn">+ 添加新车辆</button>

        <div class="table-container">
            <h3>车辆列表</h3>
            <table>
                <thead>
                <tr>
                    <th>车牌号码</th>
                    <th>车辆品牌</th>
                    <th>车辆型号</th>
                    <th>车辆类型</th>
                    <th>当前状态</th>
                    <th>驾驶员</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <td>京A12345</td>
                    <td>奔驰</td>
                    <td>S400L</td>
                    <td>轿车</td>
                    <td>可用</td>
                    <td></td>
                    <td>
                        <button class="action-btn edit-btn">编辑</button>
                        <button class="action-btn delete-btn">删除</button>
                    </td>
                </tr>
                <tr>
                    <td>京B67890</td>
                    <td>宝马</td>
                    <td>X5</td>
                    <td>SUV</td>
                    <td>使用中</td>
                    <td>curry</td>
                    <td>
                        <button class="action-btn edit-btn">编辑</button>
                        <button class="action-btn delete-btn">删除</button>
                    </td>
                </tr>
                <tr>
                    <td>京C24680</td>
                    <td>奥迪</td>
                    <td>A6L</td>
                    <td>轿车</td>
                    <td>维修中</td>
                    <td>  </td>
                    <td>
                        <button class="action-btn edit-btn">编辑</button>
                        <button class="action-btn delete-btn">删除</button>
                    </td>
                </tr>
                <tr>
                    <td>京D13579</td>
                    <td>大众</td>
                    <td>迈腾</td>
                    <td>轿车</td>
                    <td>可用</td>
                    <td>   </td>
                    <td>
                        <button class="action-btn edit-btn">编辑</button>
                        <button class="action-btn delete-btn">删除</button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
