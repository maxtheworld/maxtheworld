<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企业车辆管理系统 - 用车申请</title>
  <style>
    :root {
      --primary-color: #e8a2c2;
      --secondary-color: #e47daa;
      --light-color: #ecf0f1;
      --dark-color: #efaeca;
    }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
      color: #333;
    }
    .header {
      background-color: var(--primary-color);
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .logo {
      font-size: 24px;
      font-weight: bold;
    }
    .user-info {
      display: flex;
      align-items: center;
    }
    .container {
      display: flex;
      min-height: calc(100vh - 60px);
    }
    .sidebar {
      width: 220px;
      background-color: var(--dark-color);
      color: white;
      padding: 20px 0;
    }
    .menu-item {
      padding: 12px 20px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .menu-item:hover, .menu-item.active {
      background-color: var(--secondary-color);
    }
    .main-content {
      flex: 1;
      padding: 20px;
    }
    .form-container {
      background-color: white;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      padding: 30px;
      max-width: 800px;
      margin: 0 auto;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: var(--primary-color);
    }
    .form-control {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 16px;
    }
    .form-row {
      display: flex;
      gap: 20px;
    }
    .form-col {
      flex: 1;
    }
    .submit-btn {
      background-color: var(--secondary-color);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 20px;
    }
    .submit-btn:hover {
      background-color: #d36b96;
    }
    select.form-control {
      height: 40px;
    }
    textarea.form-control {
      min-height: 100px;
    }
  </style>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
    $(document).ready(function() {
      $('.menu-item').click(function() {
        $('.menu-item').removeClass('active');
        $(this).addClass('active');

        // 根据点击的菜单项加载对应页面
        const menuText = $(this).text().trim();
        let pageName = '';
        switch(menuText) {
          case '首页': pageName = 'qw.html'; break;
          case '用车申请': pageName = 'application.html'; break;
          case '维修保养': pageName = 'maintenance.html'; break;
          case '加油记录': pageName = 'refueling.html'; break;
          case '违章记录': pageName = 'violation.html'; break;
          case '年检管理': pageName = 'inspection.html'; break;
        }
        window.location.href = pageName;
      });
    });
  </script>
</head>
<body>
<div class="header">
  <div class="logo">企业车辆管理系统</div>
  <div class="user-info">
    欢迎，edawrd
  </div>
</div>

<div class="container">
  <div class="sidebar">
    <div class="menu-item">首页</div>
    <div class="menu-item active">用车申请</div>
    <div class="menu-item">维修保养</div>
    <div class="menu-item">加油记录</div>
    <div class="menu-item">违章记录</div>
    <div class="menu-item">年检管理</div>
  </div>

  <div class="main-content">
    <h2>用车申请表</h2>

    <div class="form-container">
      <form>
        <div class="form-row">
          <div class="form-col">
            <div class="form-group">
              <label for="applicant">申请人</label>
              <input type="text" id="applicant" class="form-control" value="edawrd" readonly>
            </div>
          </div>
          <div class="form-col">
            <div class="form-group">
              <label for="apply-date">申请日期</label>
              <input type="date" id="apply-date" class="form-control" value="2025-05-29" readonly>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="department">所属部门</label>
          <input type="text" id="department" class="form-control" placeholder="请输入您的部门">
        </div>

        <div class="form-group">
          <label for="phone">联系电话</label>
          <input type="tel" id="phone" class="form-control" placeholder="请输入您的联系电话">
        </div>

        <div class="form-group">
          <label for="reason">用车事由</label>
          <textarea id="reason" class="form-control" placeholder="请详细说明用车原因（如：业务洽谈、客户拜访、项目现场支持等）"></textarea>
        </div>

        <div class="form-row">
          <div class="form-col">
            <div class="form-group">
              <label for="start-time">出发时间</label>
              <input type="datetime-local" id="start-time" class="form-control">
            </div>
          </div>
          <div class="form-col">
            <div class="form-group">
              <label for="end-time">预计返回时间</label>
              <input type="datetime-local" id="end-time" class="form-control">
            </div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-col">
            <div class="form-group">
              <label for="start-point">出发地点</label>
              <input type="text" id="start-point" class="form-control" placeholder="请输入出发地点">
            </div>
          </div>
          <div class="form-col">
            <div class="form-group">
              <label for="destination">目的地</label>
              <input type="text" id="destination" class="form-control" placeholder="请输入目的地">
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="vehicle-type">所需车辆类型</label>
          <select id="vehicle-type" class="form-control">
            <option value="">请选择车辆类型</option>
            <option value="轿车">轿车</option>
            <option value="SUV">SUV</option>
            <option value="商务车">商务车</option>
            <option value="其他">其他</option>
          </select>
        </div>

        <div class="form-group">
          <label for="specific-vehicle">是否指定车辆</label>
          <div style="display: flex; align-items: center;">
            <input type="checkbox" id="specific-vehicle" style="margin-right: 10px;">
            <span>是（如需指定车辆，请填写车牌号）</span>
          </div>
          <input type="text" id="plate-number" class="form-control" placeholder="请输入车牌号" style="margin-top: 10px; display: none;">
        </div>

        <button type="submit" class="submit-btn">提交申请</button>
      </form>
    </div>
  </div>
</div>

<script>
  // 显示/隐藏车牌号输入框
  document.getElementById('specific-vehicle').addEventListener('change', function() {
    const plateNumberInput = document.getElementById('plate-number');
    plateNumberInput.style.display = this.checked ? 'block' : 'none';
  });
</script>
</body>
</html>
